<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<base target="_top">
<meta name="robots" content="noindex">
<style>
:root{--blue:#1f4e79;--blue-soft:#e8f0f8;--orange:#c8641c;--text:#222;--muted:#5f6b7a;--line:#d7e0ea;--danger:#b3261e}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;color:var(--text);background:#f5f8fb;line-height:1.5}
header{background:var(--blue);color:#fff;padding:14px 16px}
header h1{margin:0;font-size:20px;font-weight:700}
header .sub{font-size:14px;opacity:.85}
nav{display:flex;gap:8px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center}
nav a{padding:8px 14px;border-radius:6px;text-decoration:none;color:var(--blue);border:1px solid var(--blue);font-size:15px}
nav a.active{background:var(--blue);color:#fff}
nav .spacer{flex:1}
main{padding:16px;max-width:820px;margin:0 auto}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.add{display:flex;gap:8px;flex-wrap:wrap}
input{font:inherit;font-size:16px;padding:10px;border:1px solid #b8c4d2;border-radius:6px;flex:1 1 160px;min-width:0}
button{font:inherit;padding:9px 14px;border-radius:6px;border:1px solid var(--blue);background:#fff;color:var(--blue);cursor:pointer}
button.primary{background:var(--blue);color:#fff}
button.danger{border-color:var(--danger);color:var(--danger)}
button.link{border:0;padding:4px 6px;font-size:14px;color:var(--muted);text-decoration:underline}
button:disabled{opacity:.4;cursor:default}
.status{font-size:14px;color:var(--muted);margin-top:8px;min-height:1.4em}
.status.bad{color:var(--danger)}
.count{font-size:14px;color:var(--muted);margin-bottom:4px}
.guest{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #eef2f6;flex-wrap:wrap}
.guest:last-child{border-bottom:none}
.num{min-width:36px;text-align:center;font-weight:700;color:var(--orange);font-size:22px}
.info{flex:1 1 200px;min-width:0}
.who{font-size:22px;line-height:1.5;overflow-wrap:anywhere}
.who .name{font-weight:700}
.who .title{font-size:22px;color:var(--muted);margin-left:.4em}
.time{font-size:15px;color:var(--muted)}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.empty{color:var(--muted);padding:24px 0;text-align:center}
.login{max-width:360px;margin:24px auto}
.login h2{font-size:18px;margin:0 0 12px}
.login form{display:flex;gap:8px;flex-wrap:wrap}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal-box{background:#fff;border-radius:10px;padding:20px;width:100%;max-width:420px}
.modal-box h2{margin:0 0 12px;font-size:18px}
.modal-box label{display:block;margin-bottom:10px;font-size:15px}
.modal-box label input{display:block;width:100%;margin-top:4px}
.modal-box p{margin:0 0 12px;font-size:16px}
.err{color:var(--danger);font-size:14px;min-height:1.2em}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
</style>
</head>
<body>
<header><h1>臺南特教｜校慶來賓簽到</h1><div class="sub" id="sub"></div></header>
<nav id="nav">
  <a id="nav-checkin" href="#">簽到處管理</a>
  <a id="nav-view" href="#">校長手機查閱</a>
  <span class="spacer"></span>
  <button id="logout" class="link" type="button" hidden>登出</button>
</nav>
<main>
  <section id="sec-login" class="card login" hidden>
    <h2>請輸入簽到處管理密碼</h2>
    <form id="login-form">
      <input id="login-pass" type="password" inputmode="numeric" autocomplete="current-password" placeholder="管理密碼">
      <button class="primary" type="submit">進入</button>
    </form>
    <div id="login-status" class="status"></div>
  </section>

  <section id="sec-main" hidden>
    <div class="card" id="add-card">
      <form id="add-form" class="add">
        <input id="add-name" placeholder="來賓姓名（必填）" maxlength="40" autocomplete="off">
        <input id="add-title" placeholder="職稱（選填）" maxlength="60" autocomplete="off">
        <button id="add-btn" class="primary" type="submit">登錄簽到</button>
      </form>
      <div id="status" class="status"></div>
    </div>
    <div class="card"><div id="count" class="count"></div><div id="list"><div class="empty">載入中…</div></div></div>
  </section>
</main>

<div id="modal" class="overlay" hidden>
  <div class="modal-box" role="dialog" aria-modal="true">
    <h2 id="modal-title"></h2>
    <div id="modal-body"></div>
    <div class="modal-actions">
      <button id="modal-cancel" type="button">取消</button>
      <button id="modal-ok" type="button" class="primary">確定</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';
  var MODE = <?!= JSON.stringify(mode) ?>;
  var BASE = <?!= JSON.stringify(baseUrl) ?>;
  var POLL_MS = 4000;
  var PASS_KEY = 'tnmr-checkin-pass';

  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };
  function store(k, v) {
    try {
      if (v === undefined) return window.localStorage.getItem(k);
      if (v === null) window.localStorage.removeItem(k); else window.localStorage.setItem(k, v);
    } catch (e) { return null; }
    return null;
  }
  function errText(e) {
    return String(e && e.message || e || '發生錯誤，請再試一次。').replace(/^(Error|Exception):\s*/, '');
  }

  // 呼叫 Apps Script 函式
  function call(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var r = google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(function (e) { reject(new Error(errText(e))); });
      r[fn].apply(r, args);
    });
  }

  var guests = [];
  var busy = false;
  var lastJson = '';
  var pass = store(PASS_KEY) || '';
  var timer = null;

  function setStatus(msg, bad) {
    var el = $('status');
    el.textContent = msg || '';
    el.className = 'status' + (bad ? ' bad' : '');
  }

  function listHTML(editable) {
    if (!guests.length) return '<div class="empty">尚無來賓簽到</div>';
    return guests.map(function (g, i) {
      return '<div class="guest">' +
        '<div class="num">' + (i + 1) + '</div>' +
        '<div class="info">' +
          '<div class="who"><span class="name">' + esc(g.name) + '</span>' +
            (g.title ? '<span class="title">' + esc(g.title) + '</span>' : '') + '</div>' +
          '<div class="time">簽到時間 ' + esc(g.time) + '</div>' +
        '</div>' +
        (editable ? '<div class="actions">' +
          '<button type="button" data-act="up" data-id="' + esc(g.id) + '"' + (i === 0 ? ' disabled' : '') + '>上移</button>' +
          '<button type="button" data-act="down" data-id="' + esc(g.id) + '"' + (i === guests.length - 1 ? ' disabled' : '') + '>下移</button>' +
          '<button type="button" data-act="edit" data-id="' + esc(g.id) + '">編輯</button>' +
          '<button type="button" class="danger" data-act="del" data-id="' + esc(g.id) + '">刪除</button>' +
        '</div>' : '') +
      '</div>';
    }).join('');
  }

  function render(force) {
    var json = JSON.stringify(guests);
    if (!force && json === lastJson) return;
    lastJson = json;
    var count = '目前共 ' + guests.length + ' 位來賓';
    $('count').textContent = MODE === 'view' ? count + '・每 4 秒自動更新' : count;
    $('list').innerHTML = listHTML(MODE === 'checkin');
  }

  function refresh() {
    var modal = $('modal');
    if (busy || (modal && !modal.hidden)) return;
    call('getList').then(function (list) {
      if (busy) return;
      guests = list;
      render();
    }).catch(function (err) {
      console.error(err);
      if (!guests.length) $('list').innerHTML = '<div class="empty">暫時無法讀取名單，稍後會自動重試。</div>';
    });
  }

  function startPolling() {
    refresh();
    if (!timer) timer = setInterval(refresh, POLL_MS);
  }

  /* ---------------- 簽到處 ---------------- */

  function logout(msg) {
    pass = '';
    store(PASS_KEY, null);
    closeModal();
    $('sec-main').hidden = true;
    $('logout').hidden = true;
    $('sec-login').hidden = false;
    $('login-status').textContent = msg || '';
    $('login-status').className = 'status' + (msg ? ' bad' : '');
    $('login-pass').value = '';
  }

  function mutate(fnName, args, okMsg) {
    busy = true;
    return call.apply(null, [fnName, pass].concat(args)).then(function (list) {
      guests = list;
      render(true);
      if (okMsg) setStatus(okMsg);
      return true;
    }).catch(function (err) {
      var msg = errText(err);
      setStatus(msg, true);
      if (/密碼/.test(msg)) logout(msg);
      return false;
    }).then(function (ok) { busy = false; return ok; });
  }

  function openModal(o) {
    $('modal-title').textContent = o.title;
    $('modal-body').innerHTML = o.body;
    var ok = $('modal-ok');
    ok.textContent = o.okText;
    ok.className = o.okClass;
    ok.disabled = false;
    $('modal').hidden = false;
    ok.onclick = function () {
      ok.disabled = true;
      o.onOk().then(function (done) {
        ok.disabled = false;
        if (done !== false) closeModal();
      });
    };
    $('modal-cancel').onclick = closeModal;
    setTimeout(function () {
      var f = $('modal-body').querySelector('input');
      if (f) f.focus();
    }, 0);
  }
  function closeModal() { $('modal').hidden = true; }

  function openEdit(g) {
    openModal({
      title: '編輯來賓', okText: '儲存', okClass: 'primary',
      body: '<label>姓名<input id="edit-name" value="' + esc(g.name) + '" maxlength="40"></label>' +
            '<label>職稱<input id="edit-title" value="' + esc(g.title) + '" maxlength="60"></label>' +
            '<div id="modal-err" class="err"></div>',
      onOk: function () {
        var name = $('edit-name').value.trim();
        var title = $('edit-title').value.trim();
        if (!name) { $('modal-err').textContent = '請輸入來賓姓名。'; return Promise.resolve(false); }
        return mutate('editGuest', [g.id, name, title], '已更新「' + name + '」').then(function (ok) {
          if (!ok) $('modal-err').textContent = $('status').textContent;
          return ok;
        });
      }
    });
  }

  function openDelete(g) {
    openModal({
      title: '確認刪除', okText: '刪除', okClass: 'danger',
      body: '<p>確定要刪除來賓「' + esc(g.name) + '」' + (g.title ? '（' + esc(g.title) + '）' : '') + '嗎？</p>' +
            '<p style="font-size:14px;color:#5f6b7a">刪除後，後面來賓的序號會自動往前補。</p>',
      onOk: function () { return mutate('deleteGuest', [g.id], '已刪除「' + g.name + '」'); }
    });
  }

  function showMain() {
    $('sec-login').hidden = true;
    $('sec-main').hidden = false;
    $('logout').hidden = false;
    startPolling();
    $('add-name').focus();
  }

  function initCheckin() {
    $('login-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var p = $('login-pass').value.trim();
      if (!p) return;
      $('login-status').className = 'status';
      $('login-status').textContent = '確認中…';
      call('checkPass', p).then(function () {
        pass = p;
        store(PASS_KEY, p);
        showMain();
      }).catch(function (err) {
        $('login-status').className = 'status bad';
        $('login-status').textContent = errText(err);
      });
    });
    $('logout').addEventListener('click', function () { logout(); });

    $('add-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var name = $('add-name').value.trim();
      var title = $('add-title').value.trim();
      if (!name) { setStatus('請輸入來賓姓名。', true); return; }
      $('add-btn').disabled = true;
      setStatus('登錄中…');
      mutate('addGuest', [name, title], '已登錄「' + name + '」').then(function (ok) {
        $('add-btn').disabled = false;
        if (ok) {
          $('add-name').value = '';
          $('add-title').value = '';
          $('add-name').focus();
        }
      });
    });

    $('list').addEventListener('click', function (e) {
      var b = e.target.closest('button[data-act]');
      if (!b || busy) return;
      var id = b.dataset.id, act = b.dataset.act;
      var g = guests.filter(function (x) { return x.id === id; })[0];
      if (!g) return;
      if (act === 'up' || act === 'down') mutate('moveGuest', [id, act === 'up' ? -1 : 1], '已調整順序');
      else if (act === 'edit') openEdit(g);
      else if (act === 'del') openDelete(g);
    });

    if (pass) showMain();
    else logout();
  }

  /* ---------------- 初始化 ---------------- */

  $('nav-checkin').href = BASE + '?page=checkin';
  $('nav-view').href = BASE + '?page=view';
  $('nav-' + MODE).classList.add('active');
  $('sub').textContent = MODE === 'view' ? '來賓名單（僅供查看）' : '簽到處管理';
  if (MODE === 'view') {
    $('add-card').hidden = true;
    $('nav').hidden = false;
    $('sec-main').hidden = false;
    startPolling();
  } else {
    $('nav').hidden = false;
    initCheckin();
  }
})();
</script>
</body>
</html>
