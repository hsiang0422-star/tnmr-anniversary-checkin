<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#176b58">
  <title>校慶來賓簽到｜臺南特教</title>
  <style>
    :root { color-scheme: light; --ink:#18372f; --muted:#58716a; --green:#176b58; --line:#dce8e2; --paper:#fff; --bg:#f2f7f4; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; color:var(--ink); background:radial-gradient(circle at 12% 8%,#d9eee4 0,transparent 32%),linear-gradient(140deg,#f5f8f4,#eaf3ee); font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; }
    main { width:min(100%,760px); padding:clamp(28px,6vw,56px); background:var(--paper); border:1px solid var(--line); border-radius:24px; box-shadow:0 22px 60px #174c3d18; }
    .eyebrow { display:inline-flex; align-items:center; gap:8px; padding:7px 12px; border-radius:999px; background:#e9f5ee; color:var(--green); font-size:.88rem; font-weight:700; }
    .dot { width:8px; height:8px; border-radius:50%; background:#4caa82; }
    h1 { margin:20px 0 10px; font-size:clamp(2rem,6vw,3.25rem); letter-spacing:.02em; line-height:1.2; }
    .intro { margin:0; color:var(--muted); font-size:1.05rem; line-height:1.8; }
    .actions { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:32px; }
    .card { display:flex; min-height:150px; flex-direction:column; justify-content:space-between; padding:22px; border:1px solid var(--line); border-radius:16px; background:#fbfdfb; color:inherit; text-decoration:none; transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease; }
    .card:hover { transform:translateY(-3px); border-color:#9fcab6; box-shadow:0 12px 28px #174c3d14; }
    .card:focus-visible { outline:3px solid #73b49a; outline-offset:3px; }
    .card strong { font-size:1.2rem; }
    .card span { color:var(--muted); line-height:1.6; }
    .arrow { align-self:flex-end; color:var(--green)!important; font-size:1.25rem; }
    footer { margin-top:30px; padding-top:18px; border-top:1px solid var(--line); color:#70837c; font-size:.86rem; }
    @media (max-width:560px) { .actions { grid-template-columns:1fr; } .card { min-height:125px; } }
  </style>
</head>
<body>
  <main>
    <span class="eyebrow"><i class="dot" aria-hidden="true"></i>臺南特教・校慶活動</span>
    <h1>校慶來賓簽到</h1>
    <p class="intro">歡迎來到校慶來賓簽到入口，請依使用需求選擇下方頁面。</p>
    <section class="actions" aria-label="簽到系統入口">
      <a class="card" href="https://script.google.com/macros/s/AKfycbwU8bWwPQkK9LD1ILkyCDvAhhWn6OQcW-Lm0uujpLkFQXWUD4G81y0GM6r4raI795Z1/exec?page=desk">
        <strong>簽到處管理</strong>
        <span>新增、編輯及管理來賓簽到資料</span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>
      <a class="card" href="https://script.google.com/macros/s/AKfycbwU8bWwPQkK9LD1ILkyCDvAhhWn6OQcW-Lm0uujpLkFQXWUD4G81y0GM6r4raI795Z1/exec?page=view">
        <strong>校長查閱名單</strong>
        <span>查看已簽到的來賓及介紹狀態</span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>
    </section>
    <footer>臺南特教｜校慶來賓簽到系統</footer>
  </main>
</body>
</html>
