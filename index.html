<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#176b58">
  <title>校慶來賓簽到｜臺南特教</title>
  <style>
    :root { color-scheme: light; --ink:#18372f; --muted:#58716a; --green:#176b58; --line:#dce8e2; --paper:#fff; --bg:#f2f7f4; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; padding:28px; color:var(--ink); background:radial-gradient(circle at 12% 8%,#d9eee4 0,transparent 32%),linear-gradient(140deg,#f5f8f4,#eaf3ee); font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; }
    main { width:min(1220px,100%); margin:0 auto; }
    .top { display:flex; justify-content:space-between; align-items:flex-end; gap:20px; margin-bottom:20px; }
    .eyebrow { display:inline-flex; align-items:center; gap:8px; padding:7px 12px; border-radius:999px; background:#e9f5ee; color:var(--green); font-size:.88rem; font-weight:700; }
    .dot { width:8px; height:8px; border-radius:50%; background:#4caa82; }
    h1 { margin:14px 0 6px; font-size:clamp(1.8rem,4vw,2.5rem); letter-spacing:.02em; line-height:1.2; }
    .intro { margin:0; color:var(--muted); line-height:1.7; }
    .tabs { display:flex; gap:8px; flex-shrink:0; padding:6px; background:#e5eee9; border-radius:12px; }
    .tab { min-height:44px; padding:0 18px; border:0; border-radius:8px; background:transparent; color:var(--ink); font:inherit; cursor:pointer; }
    .tab[aria-selected="true"] { background:var(--green); color:white; box-shadow:0 3px 10px #174c3d22; }
    .tab:focus-visible { outline:3px solid #73b49a; outline-offset:2px; }
    .frame-shell { position:relative; height:min(76vh,820px); min-height:620px; overflow:hidden; border:1px solid var(--line); border-radius:18px; background:var(--paper); box-shadow:0 22px 60px #174c3d18; }
    iframe { position:absolute; inset:-122px 0 auto; display:block; width:100%; height:calc(100% + 122px); border:0; background:var(--bg); }
    .preview-card { margin-top:20px; padding:18px; border:1px solid var(--line); border-radius:18px; background:#ffffffd9; box-shadow:0 14px 40px #174c3d12; }
    .preview-heading { display:flex; align-items:center; justify-content:space-between; gap:16px; margin:0 2px 14px; }
    .preview-heading h2 { margin:0; font-size:1.15rem; }
    .preview-heading p { margin:4px 0 0; color:var(--muted); font-size:.9rem; }
    .preview-badge { padding:6px 10px; border-radius:999px; background:#e9f5ee; color:var(--green); font-size:.82rem; font-weight:700; white-space:nowrap; }
    .preview-frame-shell { position:relative; height:420px; overflow:hidden; border:1px solid var(--line); border-radius:14px; background:var(--bg); }
    .preview-frame-shell iframe { top:-122px; height:calc(100% + 122px); }
    .preview-card[hidden] { display:none; }
    .hint { margin:12px 4px 0; color:#70837c; font-size:.86rem; }
    @media (max-width:760px) {
      body { padding:18px 12px; }
      .top { display:block; }
      .tabs { margin-top:16px; }
      .tab { flex:1; padding:0 10px; }
      .frame-shell { height:78vh; min-height:560px; border-radius:14px; }
      .preview-card { padding:12px; border-radius:14px; }
      .preview-frame-shell { height:360px; }
      .preview-heading { align-items:flex-start; }
    }
  </style>
</head>
<body>
  <main>
    <header class="top">
      <div>
        <span class="eyebrow"><i class="dot" aria-hidden="true"></i>臺南特教・校慶活動</span>
        <h1>校慶來賓簽到</h1>
        <p class="intro">請選擇簽到管理或名單查閱。</p>
      </div>
      <nav class="tabs" role="tablist" aria-label="簽到系統頁面">
        <button class="tab" type="button" role="tab" id="desk-tab" aria-selected="true" data-page="desk">簽到處管理</button>
        <button class="tab" type="button" role="tab" id="view-tab" aria-selected="false" data-page="view">校長查閱名單</button>
      </nav>
    </header>
    <section class="frame-shell" aria-label="校慶來賓簽到系統">
      <iframe id="app" title="校慶來賓簽到系統" src="https://script.google.com/macros/s/AKfycbwU8bWwPQkK9LD1ILkyCDvAhhWn6OQcW-Lm0uujpLkFQXWUD4G81y0GM6r4raI795Z1/exec?authuser=0&page=desk" allow="clipboard-read; clipboard-write"></iframe>
    </section>
    <section class="preview-card" id="principal-preview" aria-labelledby="preview-title">
      <div class="preview-heading">
        <div><h2 id="preview-title">名單預覽</h2><p>同步校長查閱名單，只供唯讀查看</p></div>
        <span class="preview-badge">唯讀預覽</span>
      </div>
      <div class="preview-frame-shell">
        <iframe title="校長名單唯讀預覽" src="https://script.google.com/macros/s/AKfycbwU8bWwPQkK9LD1ILkyCDvAhhWn6OQcW-Lm0uujpLkFQXWUD4G81y0GM6r4raI795Z1/exec?authuser=0&amp;page=view&amp;mode=preview"></iframe>
      </div>
    </section>
    <p class="hint">簽到管理需要密碼；名單查閱會自動更新。</p>
  </main>
  <script>
    const frame = document.getElementById("app");
    const preview = document.getElementById("principal-preview");
    const tabs = Array.from(document.querySelectorAll(".tab"));
    tabs.forEach(tab => tab.addEventListener("click", () => {
      tabs.forEach(item => item.setAttribute("aria-selected", String(item === tab)));
      frame.src = "https://script.google.com/macros/s/AKfycbwU8bWwPQkK9LD1ILkyCDvAhhWn6OQcW-Lm0uujpLkFQXWUD4G81y0GM6r4raI795Z1/exec?authuser=0&page=" + tab.dataset.page;
      preview.hidden = tab.dataset.page !== "desk";
    }));
  </script>
</body>
</html>
