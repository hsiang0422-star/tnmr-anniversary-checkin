<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#123e45">
<title>臺南特教｜校慶來賓簽到</title>
<script src="./config.js"></script>
<style>
:root{--ink:#17383d;--muted:#60767a;--line:#dce7e4;--paper:#fff;--bg:#f1f6f3;--accent:#176b60;--accent2:#e5f2ed;--gold:#d6a84a}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#edf5f1 0%,#f8f6ed 100%);font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink);min-height:100vh}
.wrap{max-width:980px;margin:0 auto;padding:28px 18px 56px}.hero{background:linear-gradient(120deg,#123e45,#1d6b62);color:white;border-radius:24px;padding:30px 32px;box-shadow:0 14px 34px #123e4522;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;width:220px;height:220px;border:1px solid #ffffff25;border-radius:50%;right:-62px;top:-90px;box-shadow:0 0 0 26px #ffffff0c,0 0 0 56px #ffffff08}
.kicker{font-size:13px;letter-spacing:.15em;color:#d5e8d9;margin-bottom:10px}.hero h1{font-size:clamp(26px,5vw,40px);margin:0 0 8px;letter-spacing:.04em}.hero p{color:#e1eeea;margin:0;line-height:1.7}
.card{background:var(--paper);border:1px solid #e3ebe6;border-radius:20px;padding:22px;margin-top:18px;box-shadow:0 8px 24px #143b3510}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.section-title{margin:0;font-size:20px}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{font:inherit;border:0;border-radius:11px;padding:10px 15px;cursor:pointer;font-weight:650;transition:.15s}button:hover{transform:translateY(-1px)}button:disabled{opacity:.5;cursor:wait;transform:none}.primary{background:var(--accent);color:white}.soft{background:var(--accent2);color:var(--accent)}.plain{background:#f1f4f3;color:var(--ink)}.danger{background:#fff0eb;color:#a3412e}.small{font-size:13px;padding:7px 10px}
.stats{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:14px}.count{font-size:28px;font-weight:750;color:var(--accent)}
.search{width:min(300px,100%);border:1px solid var(--line);border-radius:11px;padding:10px 13px;font:inherit;outline:none}.search:focus,input:focus{border-color:#6ba89c;box-shadow:0 0 0 3px #e4f1ed}
.table-wrap{overflow-x:auto;margin-top:17px}table{border-collapse:collapse;width:100%;min-width:580px}th{text-align:left;color:var(--muted);font-size:13px;font-weight:650;background:#f6f9f7}th,td{padding:13px 12px;border-bottom:1px solid var(--line)}td:first-child,th:first-child{width:58px;color:var(--muted)}td:last-child{white-space:nowrap}.guest-name{font-weight:700}.guest-title{color:var(--muted);font-size:14px}.row-actions{display:flex;gap:5px}
.note{color:var(--muted);font-size:13px;line-height:1.6;margin:12px 0 0}.status{font-size:13px;color:var(--muted);min-height:20px}.empty{text-align:center;color:var(--muted);padding:35px 10px}
.admin-panel{display:none}.admin-panel.open{display:block}.form{display:grid;grid-template-columns:1.1fr 1.4fr auto;gap:10px;margin-top:16px}input{min-width:0;border:1px solid var(--line);border-radius:11px;padding:11px 13px;font:inherit;outline:none}
.scrim{position:fixed;inset:0;background:#0b2527a8;display:none;align-items:center;justify-content:center;padding:20px;z-index:5}.scrim.open{display:flex}.dialog{width:min(390px,100%);background:white;border-radius:20px;padding:24px;box-shadow:0 20px 80px #001c1c55}.dialog h2{margin:0 0 6px}.dialog p{color:var(--muted);font-size:14px;line-height:1.6;margin:0 0 16px}.dialog input{width:100%;margin:8px 0 16px;letter-spacing:.25em}.dialog-actions{display:flex;justify-content:flex-end;gap:8px}
.footer{text-align:center;color:#728783;font-size:12px;margin-top:18px}
@media(max-width:620px){.wrap{padding:14px 12px 38px}.hero{padding:24px 21px;border-radius:19px}.card{padding:17px;border-radius:17px}.form{grid-template-columns:1fr}.toolbar{align-items:flex-start}.search{width:100%}.desktop{display:none}}
</style>
</head>
<body>
<div class="wrap">
<header class="hero">
  <div class="kicker">臺南市立臺南特殊教育學校</div>
  <h1>校慶來賓簽到</h1>
  <p>歡迎蒞臨，一起留下校慶相聚的紀錄。</p>
</header>
<section class="card">
  <div class="toolbar">
    <div><h2 class="section-title">來賓名單</h2><div class="stats"><span class="count" id="count">—</span><span>位來賓</span><span id="updated"></span></div></div>
    <div class="actions"><input class="search" id="search" type="search" placeholder="搜尋姓名或職稱" aria-label="搜尋姓名或職稱"><button class="soft" id="refresh">重新整理</button><button class="primary" id="adminToggle">管理登入</button></div>
  </div>
  <div class="table-wrap"><table><thead><tr><th>序號</th><th>姓名</th><th>職稱／單位</th><th>簽到時間</th><th id="actionHead" hidden>管理</th></tr></thead><tbody id="rows"><tr><td colspan="4" class="empty">正在載入名單…</td></tr></tbody></table></div>
  <p class="note">名單供校慶現場查閱；管理功能需輸入工作人員密碼。</p>
  <div class="status" id="status" role="status" aria-live="polite"></div>
</section>
<section class="card admin-panel" id="adminPanel">
  <div class="toolbar"><div><h2 class="section-title">簽到管理</h2><p class="note">管理操作送出後，請確認上方名單已更新。</p></div><button class="plain" id="logout">登出管理</button></div>
  <form class="form" id="addForm"><input id="newName" maxlength="40" placeholder="來賓姓名" required><input id="newTitle" maxlength="60" placeholder="職稱或單位"><button class="primary" type="submit">新增簽到</button></form>
</section>
<div class="footer">臺南特教｜校慶來賓簽到系統</div>
</div>
<div class="scrim" id="loginScrim" role="dialog" aria-modal="true" aria-labelledby="loginTitle"><form class="dialog" id="loginForm"><h2 id="loginTitle">工作人員登入</h2><p>輸入管理密碼後即可新增、修改、刪除及調整名單順序。</p><input id="pass" type="password" inputmode="numeric" autocomplete="current-password" maxlength="12" placeholder="管理密碼" required><div class="dialog-actions"><button class="plain" type="button" id="cancelLogin">取消</button><button class="primary" type="submit">登入</button></div></form></div>
<script>
(() => {
  const API = window.CHECKIN_API_URL;
  const rows = document.getElementById('rows');
  const status = document.getElementById('status');
  const panel = document.getElementById('adminPanel');
  const guests = [];
  let pass = '';
  let busy = false;
  if (!API) { status.textContent = '尚未設定 API 網址。'; return; }
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const setStatus = text => { status.textContent = text; };
  function loadList() {
    return new Promise((resolve, reject) => {
      const cb = '_tnmrList' + Date.now() + Math.floor(Math.random()*1000);
      const script = document.createElement('script');
      let done = false;
      const timer = setTimeout(() => finish(new Error('讀取名單逾時，請稍後重試。')), 15000);
      function finish(err, data) {
        if (done) return; done = true; clearTimeout(timer); delete window[cb]; script.remove();
        if (err) reject(err); else resolve(data);
      }
      window[cb] = data => finish(null, data);
      script.onerror = () => finish(new Error('目前無法連線到簽到資料，請確認網路後重試。'));
      script.src = API + '?action=list&callback=' + cb + '&_=' + Date.now();
      document.head.appendChild(script);
    }).then(data => {
      if (!data || !data.ok) throw new Error((data && data.error) || '讀取名單失敗。');
      guests.splice(0, guests.length, ...(data.guests || []));
      render();
      document.getElementById('count').textContent = guests.length;
      document.getElementById('updated').textContent = '更新於 ' + new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});
      return guests;
    });
  }
  function render() {
    const q = document.getElementById('search').value.trim().toLowerCase();
    const filtered = guests.map((g,i)=>({g,i})).filter(x => (x.g.name+' '+x.g.title).toLowerCase().includes(q));
    const isAdmin = panel.classList.contains('open');
    document.getElementById('actionHead').hidden = !isAdmin;
    if (!filtered.length) { rows.innerHTML = '<tr><td colspan="'+(isAdmin?5:4)+'" class="empty">'+(guests.length?'沒有符合的來賓':'目前還沒有簽到資料')+'</td></tr>'; return; }
    rows.innerHTML = filtered.map(({g,i}) => '<tr><td>'+(i+1)+'</td><td class="guest-name">'+esc(g.name)+'</td><td class="guest-title">'+esc(g.title||'—')+'</td><td>'+esc(g.time||'--:--')+'</td>'+(isAdmin?'<td><div class="row-actions"><button class="soft small" data-action="up" data-id="'+esc(g.id)+'" aria-label="上移">↑</button><button class="soft small" data-action="down" data-id="'+esc(g.id)+'" aria-label="下移">↓</button><button class="plain small" data-action="edit" data-id="'+esc(g.id)+'">修改</button><button class="danger small" data-action="delete" data-id="'+esc(g.id)+'">刪除</button></div></td>':'')+'</tr>').join('');
  }
  async function post(payload) {
    if (busy) return;
    busy = true; setStatus('正在送出管理操作…');
    try {
      await fetch(API,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify({...payload,pass})});
      await new Promise(r=>setTimeout(r,900));
      await loadList();
      setStatus('已送出。請確認上方名單是否已更新；若未更新，請檢查密碼或網路。');
    } catch(e) { setStatus(e.message || '操作未完成，請重新整理確認。'); }
    finally { busy=false; }
  }
  document.getElementById('refresh').addEventListener('click',async()=>{setStatus('正在更新名單…');try{await loadList();setStatus('名單已更新。')}catch(e){setStatus(e.message)}});
  document.getElementById('search').addEventListener('input',render);
  document.getElementById('adminToggle').addEventListener('click',()=>document.getElementById('loginScrim').classList.add('open'));
  document.getElementById('cancelLogin').addEventListener('click',()=>document.getElementById('loginScrim').classList.remove('open'));
  document.getElementById('loginForm').addEventListener('submit',e=>{e.preventDefault();pass=document.getElementById('pass').value;document.getElementById('pass').value='';document.getElementById('loginScrim').classList.remove('open');panel.classList.add('open');document.getElementById('adminToggle').textContent='管理中';render();setStatus('管理模式已開啟；密碼會在送出操作時由系統確認。');});
  document.getElementById('logout').addEventListener('click',()=>{pass='';panel.classList.remove('open');document.getElementById('adminToggle').textContent='管理登入';render();setStatus('已登出管理。');});
  document.getElementById('addForm').addEventListener('submit',e=>{e.preventDefault();const name=document.getElementById('newName').value.trim(),title=document.getElementById('newTitle').value.trim();if(!name)return;post({action:'add',name,title}).then(()=>{document.getElementById('newName').value='';document.getElementById('newTitle').value='';});});
  rows.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b)return;const g=guests.find(x=>x.id===b.dataset.id);if(!g)return;const a=b.dataset.action;if(a==='edit'){const name=prompt('修改來賓姓名',g.name);if(name===null)return;const title=prompt('修改職稱或單位',g.title||'');if(title===null)return;post({action:'edit',id:g.id,name,title});}else if(a==='delete'){if(confirm('確定刪除「'+g.name+'」的簽到資料？'))post({action:'delete',id:g.id});}else post({action:'move',id:g.id,dir:a==='up'?-1:1});});
  loadList().then(()=>setStatus('名單已載入。')).catch(e=>setStatus(e.message));
  setInterval(()=>loadList().catch(()=>{}),60000);
})();
</script>
</body>
</html>
